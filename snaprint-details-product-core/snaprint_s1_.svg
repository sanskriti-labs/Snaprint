<svg width="100%" viewBox="0 0 680 670" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Snaprint S1 — corrected front elevation</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A front-view illustration of the Snaprint S1 kiosk redrawn at its true proportions: 176.8 cm tall by 55 cm wide. A thin red header holds the wordmark, a 15.6 inch touchscreen with a small QR badge sits below it sized correctly for the cabinet width, a narrow gray slot represents the print collection opening, and a tall charcoal lower body carries the step icons and brand mark, with the signature red edge stripe running the full height on the left.</desc>
