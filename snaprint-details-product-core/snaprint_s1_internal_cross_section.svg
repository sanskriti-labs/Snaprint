<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Snaprint S1 — internal cross-section, side view</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A side cross-section of the Snaprint S1 cabinet, 70 cm deep by 176.8 cm tall, front at left and rear at right. From bottom to top: a 90 cm empty base for a weighted plate, a 22 cm output and routing zone, a 50 cm zone split front to back into a thin touchscreen mount, the printer body, and a rear clearance gap where the service door sits, and a 14.8 cm upper body for branding. A small exhaust fan sits near the top of the printer compartment, clear of the rear door.</desc>
