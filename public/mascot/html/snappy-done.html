<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Snappy · done</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;display:grid;place-items:center;background:transparent}
@keyframes mBlink{0%,90%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%,100%{transform:scaleY(1)}}
@keyframes mBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes mSnooze{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.97)}}
@keyframes mZzz{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(16px,-26px) scale(1);opacity:0}}
@keyframes mLed{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes mPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes mProg2{0%,10%{transform:scaleX(0)}70%,84%{transform:scaleX(1)}94%,100%{transform:scaleX(0)}}
@keyframes mSheet2{0%,10%{transform:translateY(-32px)}70%,84%{transform:translateY(0)}94%,100%{transform:translateY(-32px)}}
@keyframes mFeedLoop{0%,4%{transform:translateY(-26px);opacity:1}40%,58%{transform:translateY(0);opacity:1}70%{transform:translateY(26px);opacity:1}71%{transform:translateY(26px);opacity:0}96%,100%{transform:translateY(-26px);opacity:0}}</style>
</head><body>

<div class="snappy" style="position:relative;width:150px;height:180px;">
  <div style="position:absolute;left:15px;top:0;width:120px;height:152px;background:#0e0e0d;border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1.5px #2f2f2c"></div>
  <div class="cap" style="position:absolute;left:15px;top:0;width:120px;height:22px;background:#e63946;border-radius:26px 26px 0 0"></div>
  <div class="screen" style="position:absolute;left:29px;top:36px;width:92px;height:62px;background:#f5f5f3;border-radius:12px"></div>

  <div style="position:absolute;left:46px;top:56px;width:16px;height:9px;border-top:4px solid #0e0e0d;border-radius:10px 10px 0 0"></div>
  <div style="position:absolute;left:88px;top:56px;width:16px;height:9px;border-top:4px solid #0e0e0d;border-radius:10px 10px 0 0"></div>
  <div style="position:absolute;left:58px;top:74px;width:34px;height:16px;background:#0e0e0d;border-radius:0 0 18px 18px"></div>
  <div style="position:absolute;left:33px;top:64px;width:11px;height:6px;background:#e63946;border-radius:4px;opacity:.55"></div>
  <div style="position:absolute;left:106px;top:64px;width:11px;height:6px;background:#e63946;border-radius:4px;opacity:.55"></div>
  <div style="position:absolute;left:45px;top:106px;width:61px;height:7px;background:#0e0e0d;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px #2a2a28"><div style="width:100%;height:100%;background:#e63946;border-radius:4px"></div></div>
  <div style="position:absolute;left:45px;top:114px;width:61px;height:32px;background:#f5f5f3;border-radius:0 0 3px 3px;box-shadow:0 5px 12px -4px rgba(0,0,0,.65);z-index:2;transform-origin:50% 0;animation:mPop .6s cubic-bezier(.34,1.5,.4,1) infinite alternate">
      <div style="position:absolute;left:9px;top:7px;width:43px;height:3px;background:#c9c9c4;border-radius:2px"></div>
      <div style="position:absolute;left:9px;top:14px;width:30px;height:3px;background:#c9c9c4;border-radius:2px"></div>

      <div style="position:absolute;left:9px;top:26px;width:18px;height:4px;background:#e63946;border-radius:2px"></div></div>
  <div style="position:absolute;left:0;top:62px;width:22px;height:9px;background:#3a3a37;border-radius:6px;transform-origin:100% 50%;transform:rotate(-14deg)"></div>
  <div style="position:absolute;right:0;top:62px;width:22px;height:9px;background:#3a3a37;border-radius:6px;transform-origin:0 50%;transform:rotate(14deg)"></div>
  <div style="position:absolute;left:44px;top:148px;width:14px;height:24px;background:#3a3a37;border-radius:0 0 7px 7px"></div>
  <div style="position:absolute;left:92px;top:148px;width:14px;height:24px;background:#3a3a37;border-radius:0 0 7px 7px"></div>
  <div style="position:absolute;left:38px;top:168px;width:26px;height:10px;background:#e63946;border-radius:6px"></div>

</div>
</body></html>
